services:
  # Backend API (FastAPI) - FREE TIER
  - type: web
    name: facturapro-backend
    env: python
    plan: free
    buildCommand: |
      cd backend
      pip install -r requirements.txt
    startCommand: cd backend && python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.4
      - key: DATABASE_URL
        value: sqlite:///./app.db
    
  # Frontend (React) - FREE TIER
  - type: web
    name: facturapro-frontend
    env: static
    plan: free
    buildCommand: |
      cd frontend
      npm install
      npm run build
    staticPublishPath: frontend/build
    envVars:
      - key: NODE_VERSION
        value: 18
      - key: REACT_APP_API_URL
        fromService:
          type: web
          name: facturapro-backend
          property: host